scalar DateTime
scalar JSON

type Repository {
  id: ID!
  source: String!
  fullName: String!
  ecosystem: String
  latestEvent: RadarEvent
  events(limit: Int = 50): [RadarEvent!]!
}

type HarmonyV3Score {
  changeProbability: Float!
  graphInfluence: Float!
  anomaly: Float!
  uncertainty: Float!
  momentum: Float!
  changePoint: Float!
  entropy: Float!
  contentYield: Float!
  reliability: Float!
  exploration: Float!
  securityFocus: Float!
  bayesianSurprise: Float!
  structuralNovelty: Float!
  tailRisk: Float!
  riskAdjustedUtility: Float!
  baseUtility: Float!
  reasons: [String!]!
}

type RadarEvent {
  id: ID!
  repository: Repository!
  observedAt: DateTime!
  eventType: String!
  semanticImpact: Float!
  fingerprint: String!
  payload: JSON!
  harmony: HarmonyV3Score
}

type RadarSummary {
  repositories: Int!
  events: Int!
  criticalEvents: Int!
  generatedAt: DateTime!
}

type Query {
  repository(source: String!, fullName: String!): Repository
  repositories(ecosystem: String, limit: Int = 100): [Repository!]!
  events(minImpact: Float = 0, maxTailRisk: Float = 1, minSurprise: Float = 0, limit: Int = 100): [RadarEvent!]!
  paretoFrontier(limit: Int = 100): [RadarEvent!]!
  summary: RadarSummary!
}
