name: Production GitLab Engineering Health Check

on:
  push:
    branches:
      - "feat/activity-matrix-v2-health-rebased"
    paths:
      - ".github/workflows/production-gitlab-health-check.yml"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Clone merged GitLab main
        run: git clone --depth=1 https://gitlab.com/axymorrsen/upstreamradar.git gitlab-main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run merged GitLab Engineering Health
        working-directory: gitlab-main
        env:
          CI_API_V4_URL: https://gitlab.com/api/v4
          CI_PROJECT_ID: "87037475"
          CI_DEFAULT_BRANCH: main
          UPSTREAMRADAR_GITLAB_PAT: ${{ secrets.GITLAB_UPSTREAMRADAR_PAT }}
        run: |
          python -m compileall -q upstreamradar scripts
          python -m scripts.engineering_health_gitlab
