name: Python CI

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "upstreamradar/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/code-review.yml"
      - ".github/workflows/radar.yml"
      - ".github/workflows/activity-matrix.yml"
      - ".github/workflows/gitlab-bridge.yml"
  pull_request:
    branches:
      - main
    paths:
      - "upstreamradar/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/code-review.yml"
      - ".github/workflows/radar.yml"
      - ".github/workflows/activity-matrix.yml"
      - ".github/workflows/gitlab-bridge.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile package and automation entrypoints
        run: python -m compileall -q upstreamradar scripts examples

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify Algorithm Museum catalog
        run: python scripts/export_museum_catalog.py --check

      - name: Run v1 example
        run: python -m examples.harmony_demo

      - name: Run v2 content-aware example
        run: python -m examples.harmony_v2_demo

      - name: Validate collector configuration
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from upstreamradar.collector import load_targets

          targets, config = load_targets(Path("config/repositories.json"))
          assert len(targets) >= 40
          assert config["scheduling"]["max_repositories_per_run"] > 0
          print(f"validated {len(targets)} configured upstream repositories")
          PY
