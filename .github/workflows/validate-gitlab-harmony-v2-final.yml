name: Validate GitLab HARMONY v2 Final

on:
  push:
    branches:
      - "feat/harmony-v2-content"
    paths:
      - ".github/workflows/validate-gitlab-harmony-v2-final.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitLab feature branch
        run: |
          git clone --depth=1 --branch feat/harmony-v2-content \
            https://gitlab.com/axymorrsen/upstreamradar.git gitlab-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate GitLab v2 branch
        working-directory: gitlab-v2
        run: |
          python -m compileall -q upstreamradar scripts examples
          python -m unittest discover -s tests -v
          python -m examples.harmony_v2_demo
