name: GitLab Bridge

on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gitlab-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstreamradar-gitlab-bridge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check GitLab bridge secret
        id: bridge_secret
        shell: bash
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_UPSTREAMRADAR_PAT }}
        run: |
          if [[ -z "${GITLAB_PAT}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "GITLAB_BRIDGE=SKIP secret GITLAB_UPSTREAMRADAR_PAT is not configured"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "GITLAB_BRIDGE=READY"
          fi

      - name: Clone public GitLab UpstreamRadar
        id: clone
        if: steps.bridge_secret.outputs.available == 'true'
        shell: bash
        run: |
          git clone --depth=1 https://gitlab.com/axymorrsen/upstreamradar.git gitlab-upstreamradar

      - name: Set up Python
        if: steps.bridge_secret.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate GitLab automation code
        id: validate
        if: steps.bridge_secret.outputs.available == 'true'
        working-directory: gitlab-upstreamradar
        run: |
          python -m compileall -q upstreamradar scripts
          python -m unittest discover -s tests -v

      - name: Run GitLab radar
        id: radar
        if: steps.bridge_secret.outputs.available == 'true'
        working-directory: gitlab-upstreamradar
        env:
          CI_API_V4_URL: https://gitlab.com/api/v4
          CI_PROJECT_ID: "87037475"
          CI_DEFAULT_BRANCH: main
          UPSTREAMRADAR_GITLAB_PAT: ${{ secrets.GITLAB_UPSTREAMRADAR_PAT }}
        run: python -m scripts.run_gitlab_radar

      - name: Advance GitLab discovery census
        id: discovery
        if: steps.bridge_secret.outputs.available == 'true'
        working-directory: gitlab-upstreamradar
        env:
          CI_API_V4_URL: https://gitlab.com/api/v4
          CI_PROJECT_ID: "87037475"
          CI_DEFAULT_BRANCH: main
          UPSTREAMRADAR_GITLAB_PAT: ${{ secrets.GITLAB_UPSTREAMRADAR_PAT }}
        run: python -m scripts.discover_gitlab

      - name: Apply governed GitLab forks
        id: fork
        if: steps.bridge_secret.outputs.available == 'true' && steps.discovery.outcome == 'success'
        working-directory: gitlab-upstreamradar
        env:
          CI_API_V4_URL: https://gitlab.com/api/v4
          CI_PROJECT_ID: "87037475"
          CI_DEFAULT_BRANCH: main
          UPSTREAMRADAR_GITLAB_PAT: ${{ secrets.GITLAB_UPSTREAMRADAR_PAT }}
        run: python -m scripts.apply_gitlab_forks

      - name: Review open GitLab merge requests
        id: review
        if: always() && steps.bridge_secret.outputs.available == 'true' && steps.clone.outcome == 'success' && steps.validate.outcome == 'success'
        working-directory: gitlab-upstreamradar
        env:
          CI_API_V4_URL: https://gitlab.com/api/v4
          CI_PROJECT_ID: "87037475"
          CI_DEFAULT_BRANCH: main
          UPSTREAMRADAR_GITLAB_PAT: ${{ secrets.GITLAB_UPSTREAMRADAR_PAT }}
        run: python -m scripts.review_gitlab_mrs

      - name: Report GitLab bridge health
        id: health
        if: always() && steps.bridge_secret.outputs.available == 'true'
        shell: bash
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_UPSTREAMRADAR_PAT }}
          GITLAB_PROJECT_ID: "87037475"
          CLONE_OUTCOME: ${{ steps.clone.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          RADAR_OUTCOME: ${{ steps.radar.outcome }}
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          FORK_OUTCOME: ${{ steps.fork.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api = "https://gitlab.com/api/v4"
          project_id = os.environ["GITLAB_PROJECT_ID"]
          token = os.environ["GITLAB_PAT"]
          title = "[bridge] GitLab automation degraded"
          run_url = os.environ["RUN_URL"]

          outcomes = {
              "clone": os.environ.get("CLONE_OUTCOME", ""),
              "validate": os.environ.get("VALIDATE_OUTCOME", ""),
              "radar": os.environ.get("RADAR_OUTCOME", ""),
              "discovery": os.environ.get("DISCOVERY_OUTCOME", ""),
              "fork": os.environ.get("FORK_OUTCOME", ""),
              "review": os.environ.get("REVIEW_OUTCOME", ""),
          }
          selftest = os.environ.get("BRIDGE_HEALTH_SELFTEST") == "degraded"
          degraded = selftest or any(value != "success" for value in outcomes.values())

          headers = {
              "PRIVATE-TOKEN": token,
              "User-Agent": "UpstreamRadar-Bridge-Health",
          }

          def request(endpoint, method="GET", payload=None):
              data = None
              local_headers = dict(headers)
              if payload is not None:
                  data = urllib.parse.urlencode(payload).encode("utf-8")
                  local_headers["Content-Type"] = "application/x-www-form-urlencoded"
              req = urllib.request.Request(
                  f"{api}{endpoint}",
                  method=method,
                  headers=local_headers,
                  data=data,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read().decode("utf-8")
                  return json.loads(raw) if raw else None

          issues = request(
              f"/projects/{project_id}/issues?state=opened&per_page=100"
          )
          issue = next((item for item in issues if item.get("title") == title), None)

          details = " ".join(f"{key}={value}" for key, value in outcomes.items())

          if degraded:
              body = (
                  "UpstreamRadar detected a degraded GitLab bridge run.\n\n"
                  f"- {details}\n"
                  f"- selftest={str(selftest).lower()}\n"
                  f"- control-plane run: {run_url}\n\n"
                  "This issue is deduplicated and will be closed automatically "
                  "after a fully successful bridge run."
              )
              if issue is None:
                  issue = request(
                      f"/projects/{project_id}/issues",
                      method="POST",
                      payload={"title": title, "description": body},
                  )
                  print(f"BRIDGE_HEALTH=ISSUE_OPENED iid={issue['iid']}")
              else:
                  request(
                      f"/projects/{project_id}/issues/{issue['iid']}/notes",
                      method="POST",
                      payload={"body": body},
                  )
                  print(f"BRIDGE_HEALTH=ISSUE_UPDATED iid={issue['iid']}")
          else:
              if issue is not None:
                  request(
                      f"/projects/{project_id}/issues/{issue['iid']}/notes",
                      method="POST",
                      payload={
                          "body": (
                              "Bridge recovered. All monitored stages completed "
                              f"successfully.\n\n- {details}\n- run: {run_url}"
                          )
                      },
                  )
                  request(
                      f"/projects/{project_id}/issues/{issue['iid']}",
                      method="PUT",
                      payload={"state_event": "close"},
                  )
                  print(f"BRIDGE_HEALTH=RECOVERED iid={issue['iid']}")
              else:
                  print("BRIDGE_HEALTH=PASS no open incident")
          PY
