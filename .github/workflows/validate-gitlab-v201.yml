name: Validate GitLab v2.0.1 reliability fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-gitlab-v201.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact GitLab fix branch
        run: |
          git clone --depth=1 --branch fix/v2-reliability-migration \
            https://gitlab.com/axymorrsen/upstreamradar.git gitlab-fix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and test GitLab fix
        working-directory: gitlab-fix
        run: |
          python -m compileall -q upstreamradar scripts examples
          python -m unittest discover -s tests -v
