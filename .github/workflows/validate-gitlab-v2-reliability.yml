name: Validate GitLab v2 reliability fix

on:
  push:
    branches:
      - "fix/v2-reliability-migration"
    paths:
      - ".github/workflows/validate-gitlab-v2-reliability.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitLab reliability-fix branch
        run: |
          git clone --depth=1 --branch fix/v2-reliability-migration \
            https://gitlab.com/axymorrsen/upstreamradar.git gitlab-fix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and test GitLab branch
        working-directory: gitlab-fix
        run: |
          python -m compileall -q upstreamradar scripts examples
          python -m unittest discover -s tests -v
