name: Validate Downstream Impact

on:
  push:
    branches:
      - "feat/downstream-impact-v1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/downstream-impact-v1

      - name: Clone GitLab feature branch
        run: |
          git clone --depth=1 --branch feat/downstream-impact-v1 \
            https://gitlab.com/axymorrsen/upstreamradar.git /tmp/gitlab-downstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate shared planner
        run: |
          python -m compileall -q upstreamradar scripts
          python -m unittest \
            tests.test_activity \
            tests.test_engineering_health \
            tests.test_maintenance \
            tests.test_governance \
            tests.test_downstream -v

      - name: Dry-run GitHub downstream routing
        env:
          UPSTREAMRADAR_PAT: dry-run-token
          DOWNSTREAM_DRY_RUN: "1"
        run: python -m scripts.downstream_github

      - name: Dry-run GitLab downstream routing
        working-directory: /tmp/gitlab-downstream
        env:
          UPSTREAMRADAR_GITLAB_PAT: dry-run-token
          DOWNSTREAM_GITHUB_PAT: dry-run-token
          DOWNSTREAM_DRY_RUN: "1"
        run: python -m scripts.downstream_gitlab

      - name: Verify Matrix v5 shared parity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          cfg=json.loads(Path("config/activity_matrix.json").read_text())
          paths=cfg["governance"]["parity"]["shared_paths"]
          mismatches=[]
          for name in paths:
              a=Path(name)
              b=Path("/tmp/gitlab-downstream") / name
              if not a.exists() or not b.exists():
                  mismatches.append((name, "missing"))
              elif a.read_bytes() != b.read_bytes():
                  mismatches.append((name, "content"))
          if mismatches:
              raise SystemExit(f"PARITY=FAIL {mismatches}")
          print(f"PARITY=PASS checked={len(paths)}")
          PY
