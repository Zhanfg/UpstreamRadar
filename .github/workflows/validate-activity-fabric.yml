name: Validate Activity Fabric

on:
  push:
    branches:
      - "feat/activity-fabric-v1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and test
        run: |
          python -m compileall -q upstreamradar scripts
          python -m unittest discover -s tests -v
      - name: Benchmark smoke test
        run: |
          python -m scripts.benchmark_harmony \
            --baseline /tmp/benchmark.json \
            --output /tmp/benchmark-report.json
      - name: Security posture smoke test
        run: |
          python -m scripts.security_posture --output /tmp/security.json || rc=$?
          rc=${rc:-0}
          test "${rc}" -ne 2

  gitlab-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitLab feature branch
        run: |
          git clone --depth=1 --branch feat/activity-fabric-v1 \
            https://gitlab.com/axymorrsen/upstreamradar.git gitlab-fabric
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and test GitLab branch
        working-directory: gitlab-fabric
        run: |
          python -m compileall -q upstreamradar scripts
          python -m unittest discover -s tests -v
      - name: GitLab benchmark/security smoke tests
        working-directory: gitlab-fabric
        run: |
          python -m scripts.benchmark_harmony \
            --baseline /tmp/gitlab-benchmark.json \
            --output /tmp/gitlab-benchmark-report.json
          python -m scripts.security_posture --output /tmp/gitlab-security.json || rc=$?
          rc=${rc:-0}
          test "${rc}" -ne 2
