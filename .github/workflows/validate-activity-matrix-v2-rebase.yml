name: Validate Activity Matrix v2 Health Rebase

on:
  push:
    branches:
      - "feat/activity-matrix-v2-health-rebased"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m compileall -q upstreamradar scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.benchmark_harmony --baseline /tmp/gh-bench.json --output /tmp/gh-bench-report.json
      - run: python -m scripts.security_posture --output /tmp/gh-security.json

  gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitLab v2 branch
        run: |
          git clone --depth=1 --branch feat/activity-matrix-v2-health \
            https://gitlab.com/axymorrsen/upstreamradar.git gitlab-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate GitLab branch
        working-directory: gitlab-v2
        run: |
          python -m compileall -q upstreamradar scripts
          python -m unittest discover -s tests -v
          python -m scripts.benchmark_harmony \
            --baseline /tmp/gl-bench.json \
            --output /tmp/gl-bench-report.json
          python -m scripts.security_posture --output /tmp/gl-security.json
