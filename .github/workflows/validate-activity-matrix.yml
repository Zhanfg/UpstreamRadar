name: Validate Activity Matrix

on:
  push:
    branches:
      - "feat/activity-matrix"
    paths:
      - ".github/workflows/validate-activity-matrix.yml"
      - "upstreamradar/activity.py"
      - "scripts/run_github_activity.py"
      - "config/activity_matrix.json"
      - "tests/test_activity.py"

permissions:
  contents: read

jobs:
  github-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m compileall -q upstreamradar scripts
          python -m unittest tests.test_activity -v
          ACTIVITY_DRY_RUN=1 UPSTREAMRADAR_PAT=dry-run python -m scripts.run_github_activity

  gitlab-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitLab feature branch
        run: |
          git clone --depth=1 --branch feat/activity-matrix             https://gitlab.com/axymorrsen/upstreamradar.git gitlab-activity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate GitLab Activity Matrix
        working-directory: gitlab-activity
        env:
          ACTIVITY_DRY_RUN: "1"
          UPSTREAMRADAR_GITLAB_PAT: "dry-run"
          CI_API_V4_URL: https://gitlab.com/api/v4
          CI_PROJECT_ID: "87037475"
          CI_DEFAULT_BRANCH: main
        run: |
          python -m compileall -q upstreamradar scripts
          python -m unittest tests.test_activity -v
          python -m scripts.run_gitlab_activity
